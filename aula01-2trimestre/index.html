<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Formulário HTML</title>  <!-- Correto -->
</head>  <!-- Correto -->

<body>
<h1>Cadastro de Usuário</h1>  <!-- Correto -->

<form action="cadastro.php" method="post"> <!-- Correto -->

<label for="nome">Nome:</label> 
<input type="text" id="nome" name="nome"> <!-- Correto -->
<br>

<label for="email">E-mail:</label>
<input type="email" id="email" name="email"> <!-- Correto -->
<br>

<label for="senha">Senha:</label>
<input type="password" id="senha" name="senha">  <!-- Correto -->
<br>

<label for="idade">Idade:</label>
<input type="number" id="idade" name="idade">
<br>

<label for="nascimento">Data de nascimento:</label>  <!-- Correto -->
<input type="date" id="nascimento" name="nascimento">  <!-- Correto -->
<br>

<p>Turno:</p>
<input type="radio" name="turno" id="manha" value="manha">
<label for="manha">Manhã</label>

<input type="radio" name="turno" id="tarde" value="tarde">  <!-- Correto -->
<label for="tarde">Tarde</label>

<input type="radio" name="turno" id="noite" value="noite">  <!-- Correto -->
<label for="noite">Noite</label>
<br>

<p>Áreas de interesse:</p>
<input type="checkbox" name="areas[]" id="programacao" value="programacao">
<label for="programacao">Programação</label>

<input type="checkbox" name="areas[]" id="design" value="design">
<label for="design">Design</label>

<input type="checkbox" name="areas[]" id="redes" value="redes">  <!-- Correto -->
<label for="redes">Redes</label>
<br>

<input type="submit" value="Enviar">  <!-- Correto -->
<input type="reset" value="Limpar">  <!-- Correto -->

</form>
</body>
</html>
